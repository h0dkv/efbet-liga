name: Update scores
on:
  schedule:
    - cron: "30 */3 * * *"   # every 3 hours; nothing happens unless a finished match has no score
  workflow_dispatch:          # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update-scores.mjs   # free: reads parvaliga.bg. For an AI instead, add PROVIDER and the key in an env: block.
      - run: |
          git config user.name "scores-bot"
          git config user.email "scores-bot@users.noreply.github.com"
          git add results.js
          git diff --cached --quiet || (git commit -m "Update scores" && git push)
