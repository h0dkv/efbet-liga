        function authV(m) {
            if (U) { setTimeout(() => location.hash = "#/leagues"); return "" } AM = m; const r = m == "register", f = (id, t, ty, ac) => `<label class="fl"><input id="${id}" type="${ty}" placeholder=" " autocomplete="${ac}"><span>${t}</span></label><div class="em" id="${id}e"></div>`;

            return `<section class="auth"><div class="auth-art"><div class="orb o1"></div><div class="orb o2"></div><img class="a-logo" src="logo.png" alt="efbet Liga" width="96" height="100"><h2>${r ? "Start your" : "Welcome"} <span>${r ? "season" : "back"}</span></h2><p>Build your team, create private leagues and climb the table with your friends.</p><div class="ball a-ball"></div></div><form class="auth-card" onsubmit="return auth(event)" novalidate><div class="tabs ${r ? "reg" : ""}"><a href="#/login" class="${r ? "" : "on"}">Log in</a><a href="#/register" class="${r ? "on" : ""}">Register</a><i></i></div><h2>${r ? "Create account" : "Log in"}</h2>${r ? f("an", "Your name", "text", "name") : ""}${f("ae", "Email", "email", "email")}${pw("ap", "Password", r ? "new-password" : "current-password")}${r ? pw("ac", "Confirm password", "new-password") : ""}<button class="btn" id="ab">${r ? "Create account" : "Log in"}</button><p class="sw mut">${r ? 'Have an account? <a href="#/login">Log in</a>' : 'New here? <a href="#/register">Create an account</a>'}</p>${r ? '<p class="note">Your current team is saved to your new account.</p>' : ""}</form></section>`

        function lgV() {

            }

            return `<h2>Leagues</h2>${mine.map((c, i) => { const rows = lgRows(c); return `<div class="lcard" style="animation-delay:${i * .07}s" onclick="LG='${c}';draw()"><span class="lr">#${rows.findIndex(r => r.me) + 1}</span><div><b>${lgName(c)}</b><small>${rows.length} managers${c != "ALL" ? " · Code " + c : ""}</small></div><span>›</span></div>` }).join("")}<div class="lforms"><form class="card" onsubmit="return cl(event)" novalidate><h3>➕ Create a league</h3><input id="ln" placeholder="League name"><div class="em" id="lne"></div><label class="chk"><input type="checkbox" id="ld" checked> Add demo managers to try it out</label><button class="btn" style="animation:none;margin-top:10px">Create</button></form><form class="card" onsubmit="return jl(event)" novalidate><h3>🔑 Join with a code</h3><input id="lj" placeholder="League code" maxlength="6" style="text-transform:uppercase"><div class="em" id="lje"></div><button class="btn" style="animation:none;margin-top:10px">Join</button></form></div>`

        const V = {
            "/": () => `<section class="hero"><img class="hero-logo" src="logo.png" alt="efbet Liga" width="230" height="240"><span class="tag">Season 2026/27 · 14 clubs · Round 11</span><h1>Be the manager of <span>Bulgarian football</span></h1><p>Pick 15 efbet League players on a ${BUD}M budget, captain your star and climb the table every round. Free to play.</p><div class="cta-row"><a class="btn" href="#/play">Build your team ⚡</a><a class="btn ghost" href="#/rules">How scoring works</a></div></section><div class="stats"><div><b>14</b><small>Clubs</small></div><div><b>15</b><small>Players</small></div><div><b>${BUD}M</b><small>Budget</small></div><div><b>×2</b><small>Captain</small></div></div><div class="grid"><div class="card"><h3>💰 Real budget</h3><p>${BUD}M, max ${LIM} per club, with recommended prices for every player.</p></div><div class="card"><h3>📊 FPL points</h3><p>Goals, assists, clean sheets, cards and captain ×2.</p></div><div class="card"><h3>📅 Real fixtures</h3><p>Check the next round before every transfer.</p></div></div>`,
            "/play": () => { const pi = pitch(), role = S.pickSlot ? S.pickSlot.split("-")[0] : ""; return `<h2>${S.name || "Your squad"}</h2><div class="sumb"><div><b>${left()}M</b><small>Bank</small></div><div class="mid"><b>${S.pts ? pi.tot : "–"}</b><small>Round pts</small></div><div><b>${S.sq.length}/15</b><small>Squad</small></div></div><div class="seg"><button class="${S.view != "list" ? "on" : ""}" onclick="S.view='pitch';draw()">Pitch</button><button class="${S.view == "list" ? "on" : ""}" onclick="S.view='list';draw()">List</button></div>${S.view == "list" ? listv() : pi.h}${bar()}<div class="toolbar"><button class="btn ghost" onclick="sim()">Score demo round</button> <button class="btn ghost" onclick="S.sq=[];S.cap=null;S.pts=null;S.pickSlot=null;S.sel=null;sv();draw()">Reset</button></div><p class="note">Tap an empty position to pick a player. Tap a player to make them captain or remove them. The bench (bottom panel) scores no points; the XI is a fixed 4-4-2.</p><div class="market-panel"><div class="market-head"><h3>${role ? `${role} players` : "Choose a position"}</h3>${role ? `<button class="chip" onclick="S.pickSlot=null;draw()">Clear filter</button>` : ""}</div>${list()}</div><div class="card compact"><h3>Save your team</h3><form onsubmit="return sub(event)" novalidate><input id="tn" placeholder="Team name" value="${S.name || ""}"><div class="em" id="e1"></div>${U ? "" : `<input id="em" type="email" placeholder="Email"><div class="em" id="e2"></div>`}<button class="btn" id="sb" style="animation:none">Save team</button></form></div>` },
            "/fixtures": () => `<h2>Fixtures &amp; table</h2><p class="note">Verified: rounds 1–3, round 11 (10–11 Oct) and Levski's rounds 10 and 12. Other rounds load once the official list is synced.</p><div class="card tw" style="margin:14px 0"><h3>Table <small class="mut">Sofascore, Oct 2026</small></h3><table class="tbl"><tr><th>#</th><th>Club</th><th>P</th><th>GD</th><th>Pts</th></tr>${TB.map((r, i) => `<tr><td><span class="rk ${i < 3 ? "top" : ""}">${i + 1}</span></td><td><i class="dot" style="background:${CL[r[0]][1]}"></i>${CL[r[0]][0]}</td><td>${r[1]}</td><td>${r[2] > 0 ? "+" : ""}${r[2]}</td><td><b>${r[3]}</b></td></tr>`).join("")}</table></div><div class="rounds">${Object.keys(FX).map(r => `<div class="card"><h3>Round ${r} ${r == 11 ? '<span class="tag">Next</span>' : ""}</h3>${FX[r].map(m => `<div class="mt"><span class="tm"><i class="dot" style="background:${CL[m[0]][1]}"></i>${CL[m[0]][0]}</span><b class="vs">VS</b><span class="tm r">${CL[m[1]][0]}<i class="dot" style="background:${CL[m[1]][1]}"></i></span></div>`).join("")}</div>`).join("")}</div>`,
            "/rules": () => `<h2>Scoring &amp; budget</h2><div class="rules">${[["Plays 1–59 min", "+1"], ["Plays 60+ min", "+2"], ["Goal · GK / DEF", "+6"], ["Goal · MID", "+5"], ["Goal · FWD", "+4"], ["Assist", "+3"], ["Clean sheet · GK / DEF", "+4"], ["Clean sheet · MID", "+1"], ["Every 3 GK saves", "+1"], ["Penalty save", "+5"], ["Penalty miss", "-2"], ["2 goals conceded · GK / DEF", "-1"], ["Yellow card", "-1"], ["Red card", "-3"], ["Own goal", "-2"], ["Captain", "×2"]].map(r => `<div class="rule"><span>${r[0]}</span><b class="pt ${r[1][0] == "-" ? "dn" : "up"}">${r[1]}</b></div>`).join("")}</div><div class="stats"><div><b>${BUD}M</b><small>Budget</small></div><div><b>15</b><small>2 GK · 5 DEF · 5 MID · 3 FWD</small></div><div><b>${LIM}</b><small>Max per club</small></div></div><p class="note">Recommended price = 4.2 + 1.7 × √(estimated value in €M), capped 4.0–9.5. Values are estimates from club tier, position and squad rank.</p>`,
            "/privacy": () => `<article class="doc"><h2>Privacy Policy</h2><p class="mut">Last updated: 11 October 2026</p><h3>1. What we store</h3><p>Your team is saved in your browser. If you register, your name, email, team and leagues are stored with our backend provider (Supabase); passwords are handled by Supabase Auth and are never stored by us.</p><h3>2. Cookies</h3><p>Essential storage keeps your team between visits. Analytics are only used if you accept them in the cookie banner.</p><h3>3. Sharing</h3><p>We do not sell your data.</p><h3>4. Your rights</h3><p>Contact us to access or delete your data (GDPR).</p><p class="note">Template text: have it reviewed before launch.</p></article>`,
            "/terms": () => `<article class="doc"><h2>Terms of Use</h2><p class="mut">Last updated: 11 October 2026</p><h3>1. The game</h3><p>A free game for entertainment, 18+. No prizes, no betting.</p><h3>2. Points</h3><p>Points are unofficial and may be corrected.</p><h3>3. Changes</h3><p>We may change or stop the game at any time.</p><h3>4. Unofficial</h3><p>This is an unofficial fan project, not affiliated with efbet or the league. Names and logos belong to their owners.</p><p class="note">Template text: have it reviewed before launch.</p></article>`,
            "/login": () => authV("login"), "/register": () => authV("register"), "/leagues": () => lgV(),
            "/404": () => `<section class="nf"><h1>4<span class="ball"></span>4</h1><div class="redcard"></div><h2>Sent off!</h2><p>This page isn't on the team sheet.</p><a class="btn" href="#/">Back to kick-off</a></section>`
        };
        function sub(e) { e.preventDefault(); const n = $("#tn"), m = $("#em"); let ok = 1;[[n, "#e1", n.value.trim().length < 3, "Team name needs 3+ characters"], ...(m ? [[m, "#e2", !/^\S+@\S+\.\S+$/.test(m.value), "Enter a valid email"]] : [])].forEach(([i, s, bad, t]) => { i.classList.toggle("err", bad); $(s).textContent = bad ? t : ""; if (bad) ok = 0 }); if (S.sq.length < 15) { toast("Pick 15 players first"); ok = 0 } if (!ok) return false; const b = $("#sb"); b.disabled = 1; b.innerHTML = '<span class="spin"></span> Saving'; setTimeout(() => { S.name = n.value.trim(); sv(); b.disabled = 0; b.textContent = "Save team"; toast("Team saved ✅") }, 1100); return false }
        function draw() { let r = (location.hash.slice(1) || "/").split("?")[0]; if (!V[r]) r = "/404"; const sy = scrollY; $(".sticky").classList.toggle("hide", r == "/play" || r == "/login" || r == "/register" || U); if (r != "/leagues") { LG = null; RM.ok = false } $("#app").innerHTML = `<div class="view">${V[r]()}</div>`; const t = PG[r]; document.title = t[0]; let d = document.querySelector('meta[name=description]'); d.content = t[1]; document.querySelector('meta[property="og:title"]').content = t[0]; document.querySelector('meta[property="og:description"]').content = t[1]; $("#nav").innerHTML = [["/", "Home"], ["/play", "Play"], ["/leagues", "Leagues"], ["/fixtures", "Fixtures"], ["/rules", "Rules"]].map(l => `<a href="#${l[0]}" class="${r == l[0] ? "on" : ""}">${l[1]}</a>`).join("") + (U ? `<a href="#/leagues" class="me" title="${U.name}">${U.name[0].toUpperCase()}</a><button class="lo" onclick="out()">Log out</button>` : `<a href="#/login" class="lin ${r == "/login" || r == "/register" ? "on" : ""}">Log in</a>`); $("#app").querySelector(".view").insertAdjacentHTML("beforeend", `<footer style="margin-top:40px;font-size:13px;color:var(--mut)"><a href="#/privacy">Privacy</a> · <a href="#/terms">Terms</a> · Unofficial fan game</footer>`); if (r != "/play") scrollTo(0, 0); else scrollTo(0, sy) }
        addEventListener("hashchange", draw); draw();
        setTimeout(() => $("#loader").classList.add("off"), 1700);
        try { if (!localStorage.getItem("efc")) setTimeout(() => $("#cookie").style.display = "block", 2200) } catch (e) { }
    </script>
