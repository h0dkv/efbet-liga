        function pitch() {

                const cap = S.cap == p.id, pt = S.pts && S.pts[p.id] != null ? S.pts[p.id] * (cap && !bench ? 2 : 1) : null;
                if (pt != null && !bench) tot += pt;
                d += .05;

                let subBadge = "";
                if (subsInfo.subbedIn.has(p.id)) subBadge = '<span class="sub-badge sub-in">ВХОД</span>';
                if (subsInfo.subbedOut.has(p.id)) subBadge = '<span class="sub-badge sub-out">ИЗХОД</span>';

            };
            const row = r => `<div class="pr">${Array.from({ length: ST[r] }, (_, i) => card(r, i)).join("")}</div>`;

            return { h, tot };
        }

            return Date.now() >= matchDate(earliest).getTime();
        }

        async function hs(s) { try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("ef:" + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("") } catch (e) { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return "x" + h } }
        function shake() { const c = $(".auth-card"); if (!c) return; c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake") }

        let ut; const up = () => { clearTimeout(ut); ut = setTimeout(push, 700) };
        async function push() { clearTimeout(ut); if (!sb || !U) return; try { await sb.from("teams").upsert({ user_id: U.id, data: S }); await sb.from("profiles").update({ team_name: S.name || null, total_pts: S.tp || 0 }).eq("id", U.id) } catch (e) { } }

        async function loadRemote() { try { const { data } = await sb.from("teams").select("data").eq("user_id", U.id).maybeSingle(); if (data && data.data) S = Object.assign(S, data.data); await loadLeagues(); } catch (e) { } }

        async function auth(ev) {

            const [pageTitle, pageDescription] = PG[path] || PG["/404"];
            document.title = pageTitle;

            if (description) description.content = pageDescription;
            document.body.classList.toggle("squad-route", path === "/play");

            const app = $("#app");
            if (app) app.innerHTML = fn();

            const nav = $("#nav");
            if (nav) {
                const links = [
                    ["#/", "Начало"],
                    ["#/play", "Състав"],
                    ["#/transfers", "Трансфери"],
                    ["#/leagues", "Лиги"],
                    ["#/fixtures", "Програма"],
                    ["#/rules", "Правила"],
                    ...(isAdmin() ? [["#/admin", "Админ"]] : []),
                    U ? ["#/profile", "Профил"] : ["#/login", "Вход"]
                ];
                nav.innerHTML = `<span class="nav-indicator" aria-hidden="true"></span>` + links.map(([h, t]) => `<a href="${h}" class="${hash === h ? "on" : ""}" ${hash === h ? 'aria-current="page"' : ""}>${t}</a>`).join("");
                requestAnimationFrame(syncNavIndicator);
            }

            const loader = $("#loader");
            if (loader && !loaderDismissed) {
                loaderDismissed = true;
                const entranceDuration = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 200 : 1650;

            }
        }

        $("#nav")?.addEventListener("click", event => {
            if (!event.target.closest("a")) return;
            $("#nav").classList.remove("open");
            $("#hamburger")?.setAttribute("aria-expanded", "false");
            $("#hamburger")?.setAttribute("aria-label", "Отвори навигацията");
            $("#hamburger")?.replaceChildren(document.createTextNode("☰"));
        });
        window.addEventListener("resize", () => requestAnimationFrame(syncNavIndicator));
        window.addEventListener("DOMContentLoaded", () => {
            loadS();
            draw();
        });
    </script>
</body>
</html>
