            return `<div class="card cal"><div class="calh"><button class="chip" onclick="mo(-1)" aria-label="Previous month">‹</button><h3>${MON[m - 1]} ${y}</h3><button class="chip" onclick="mo(1)" aria-label="Next month">›</button></div><div class="cdg ${FS.anim ? "anim" : ""}">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"].map(d => `<span>${d}</span>`).join("")}${cells}</div></div><h3 class="dh">${FS.day == TD ? "Today · " : ""}${fmt(FS.day)}</h3>${L.length ? L.map((x, i) => mc(x, i)).join("") : '<p class="mut">No matches this day.</p>'}`
        }
        const roundsV = () => `<div class="rds">${Array.from({ length: 26 }, (_, i) => `<button class="chip ${FS.rd == i + 1 ? "on" : ""}" onclick="fs('rd',${i + 1})">${i + 1 == CUR ? "▶ " : ""}R${i + 1}</button>`).join("")}</div><h3 class="dh">Round ${FS.rd}</h3>${MT.filter(x => x.r == FS.rd).sort(byTime).map((x, i) => mc(x, i, 1)).join("")}`;
        function tableV() {
            const t = {}, pl = MT.filter(m => m.hg != null); Object.keys(CL).forEach(c => t[c] = { c, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0 });
            pl.forEach(m => { const H = t[m.h], A = t[m.a]; H.p++; A.p++; H.gf += m.hg; H.ga += m.ag; A.gf += m.ag; A.ga += m.hg; if (m.hg > m.ag) { H.w++; A.l++ } else if (m.hg < m.ag) { A.w++; H.l++ } else { H.d++; A.d++ } });
            const rows = Object.values(t).map(x => ({ ...x, gd: x.gf - x.ga, pts: x.w * 3 + x.d })).sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
            return `<div class="card tw"><h3>Table <small class="mut">after ${pl.length} matches</small></h3><table class="tbl"><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>${rows.map((r, i) => `<tr><td><span class="rk ${i < 3 ? "top" : ""}">${i + 1}</span></td><td><i class="dot" style="background:${CL[r.c][1]}"></i>${CL[r.c][0]}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gd > 0 ? "+" : ""}${r.gd}</td><td><b>${r.pts}</b></td></tr>`).join("")}</table></div>`
        }
        const V = {
            "/": () => `<section class="hero"><img class="hero-logo" src="logo.png" alt="efbet Liga" width="230" height="240"><span class="tag">Season 2026/27 · 14 clubs · Round ${CUR}</span><h1>Be the manager of <span>Bulgarian football</span></h1><p>Pick 15 efbet League players on a ${BUD}M budget, captain your star and climb the table every round. Free to play.</p><div class="cta-row"><a class="btn" href="#/play">Build your team ⚡</a><a class="btn ghost" href="#/rules">How scoring works</a></div></section><div class="stats"><div><b>14</b><small>Clubs</small></div><div><b>15</b><small>Players</small></div><div><b>${BUD}M</b><small>Budget</small></div><div><b>×2</b><small>Captain</small></div></div><div class="grid"><div class="card"><h3>💰 Real budget</h3><p>${BUD}M, max ${LIM} per club, with recommended prices for every player.</p></div><div class="card"><h3>📊 FPL points</h3><p>Goals, assists, clean sheets, cards and captain ×2.</p></div><div class="card"><h3>📅 Real fixtures</h3><p>Check the next round before every transfer.</p></div></div>`,
            "/play": () => { const pi = pitch(), role = S.pickSlot ? S.pickSlot.split("-")[0] : ""; return `<h2>${S.name || "Your squad"}</h2><div class="sumb"><div><b>${left()}M</b><small>Bank</small></div><div class="mid"><b>${S.pts ? pi.tot : "–"}</b><small>Round pts</small></div><div><b>${S.sq.length}/15</b><small>Squad</small></div></div><div class="seg"><button class="${S.view != "list" ? "on" : ""}" onclick="S.view='pitch';draw()">Pitch</button><button class="${S.view == "list" ? "on" : ""}" onclick="S.view='list';draw()">List</button></div>${rdBar()}${S.view == "list" ? listv() : pi.h}${bar()}<div class="toolbar"><button class="btn ghost" onclick="S.sq=[];S.cap=null;S.pts=null;S.pickSlot=null;S.sel=null;sv();draw()">Reset</button></div><p class="note">Tap an empty position to pick a player. Tap a player to make them captain or remove them. The bench (bottom panel) scores no points; the XI is a fixed 4-4-2. Points come from the player stats entered after each round.</p><div class="market-panel"><div class="market-head"><h3>${role ? `${role} players` : "Choose a position"}</h3>${role ? `<button class="chip" onclick="S.pickSlot=null;draw()">Clear filter</button>` : ""}</div>${list()}</div><div class="card compact"><h3>Save your team</h3>${U ? `<form onsubmit="return sub(event)" novalidate><input id="tn" placeholder="Team name" value="${S.name || ""}"><div class="em" id="e1"></div><button class="btn" id="sb" style="animation:none">Save team</button></form>` : `<p class="mut" style="margin-bottom:12px">Трябва да влезете в профила си, за да запазите отбора.</p><a class="btn" href="#/login">Вход в акаунт</a>`}</div>` },
            "/transfers": () => transfersV(),
            "/profile": () => profileV(),
            "/fixtures": () => !MT.length ? `<h2>Fixtures</h2><p class="note">Schedule data didn't load. Keep fixtures.js next to index.html.</p>` : `<h2>Fixtures &amp; results</h2><p class="mut" style="margin:4px 0 12px">Round ${CUR} is next · Bulgarian local time · source: parvaliga.bg</p><div class="seg s3">${[["cal", "Calendar"], ["rounds", "Rounds"], ["table", "Table"]].map(t => `<button class="${FS.tab == t[0] ? "on" : ""}" onclick="fs('tab','${t[0]}')">${t[1]}</button>`).join("")}</div>${FS.tab == "cal" ? calV() : FS.tab == "rounds" ? roundsV() : tableV()}`,
            "/rules": () => `<h2>Scoring &amp; budget</h2><div class="rules">${[["Plays 1–59 min", "+1"], ["Plays 60+ min", "+2"], ["Goal · GK / DEF", "+6"], ["Goal · MID", "+5"], ["Goal · FWD", "+4"], ["Assist", "+3"], ["Clean sheet · GK / DEF", "+4"], ["Clean sheet · MID", "+1"], ["Every 3 GK saves", "+1"], ["Penalty save", "+5"], ["Penalty miss", "-2"], ["2 goals conceded · GK / DEF", "-1"], ["Yellow card", "-1"], ["Red card", "-3"], ["Own goal", "-2"], ["Bonus points (BPS)", "+1 to +3"], ["Captain", "×2"]].map(r => `<div class="rule"><span>${r[0]}</span><b class="pt ${r[1][0] == "-" ? "dn" : "up"}">${r[1]}</b></div>`).join("")}</div><div class="stats"><div><b>${BUD}M</b><small>Budget</small></div><div><b>15</b><small>2 GK · 5 DEF · 5 MID · 3 FWD</small></div><div><b>${LIM}</b><small>Max per club</small></div></div><p class="note">Recommended price = 4.2 + 1.7 × √(estimated value in €M), capped 4.0–9.5.</p>`,
            "/privacy": () => `<article class="doc"><h2>Privacy Policy</h2><p class="mut">Last updated: 11 October 2026</p><h3>1. What we store</h3><p>Your team is saved in your browser or Supabase account.</p><h3>2. Cookies</h3><p>Essential storage keeps your team between visits.</p></article>`,
            "/terms": () => `<article class="doc"><h2>Terms of Use</h2><p class="mut">Last updated: 11 October 2026</p><h3>1. The game</h3><p>A free game for entertainment, 18+. No prizes, no betting.</p></article>`,
            "/admin": () => adminV(), "/login": () => authV("login"), "/register": () => authV("register"), "/leagues": () => lgV(),
            "/404": () => `<section class="nf"><h1>4<span class="ball"></span>4</h1><div class="redcard"></div><h2>Sent off!</h2><p>This page isn't on the team sheet.</p><a class="btn" href="#/">Back to kick-off</a></section>`
        };
        function sub(e) { 
            e.preventDefault(); 
            const n = $("#tn"); 
            let ok = 1;
            const bad = n.value.trim().length < 3;
            n.classList.toggle("err", bad);
            const errEl = $("#e1");
            if (errEl) errEl.textContent = bad ? "Team name needs 3+ characters" : "";
            if (bad) ok = 0;
            if (S.sq.length < 15) { toast("Pick 15 players first"); ok = 0; } 
            if (!ok) return false; 
            const b = $("#sb"); 
            if (b) { b.disabled = 1; b.innerHTML = '<span class="spin"></span> Saving'; } 
            setTimeout(() => { 
                S.name = n.value.trim(); 
                sv(); 
                if (b) { b.disabled = 0; b.textContent = "Save team"; } 
                toast("Team saved ✅"); 
            }, 1100); 
            return false; 
        }
        function draw() {
            prep(); let r = (location.hash.slice(1) || "/").split("?")[0]; if (!V[r]) r = "/404"; const sy = scrollY; const sticky = $(".sticky"); if (sticky) sticky.classList.toggle("hide", r == "/play" || r == "/admin" || r == "/login" || r == "/register" || U); if (r != "/leagues") { LG = null; RM.ok = false } const app = $("#app"); if (app) app.innerHTML = `<div class="view ${r == PR ? "same" : ""}">${V[r]()}</div>`; const t = PG[r]; document.title = t[0]; let d = document.querySelector('meta[name=description]'); if (d) d.content = t[1]; const ogTitle = document.querySelector('meta[property="og:title"]'); if (ogTitle) ogTitle.content = t[0]; const ogDesc = document.querySelector('meta[property="og:description"]'); if (ogDesc) ogDesc.content = t[1]; 
            const nav = $("#nav"); 
            if (nav) nav.innerHTML = [["/", "Home"], ["/play", "Play"], ["/transfers", "Трансфери"], ["/profile", "Профил"], ["/leagues", "Leagues"], ["/fixtures", "Fixtures"], ["/rules", "Rules"]].map(l => `<a href="#${l[0]}" class="${r == l[0] ? "on" : ""}" onclick="const n=$('#nav');if(n)n.classList.remove('open')">${l[1]}</a>`).join("") + (U ? `<a href="#/profile" class="me" title="${U.name}">${U.name[0].toUpperCase()}</a><button class="lo" onclick="out()">Log out</button>` : `<a href="#/login" class="lin ${r == "/login" || r == "/register" ? "on" : ""}" onclick="const n=$('#nav');if(n)n.classList.remove('open')">Log in</a>`);
            const viewEl = app ? app.querySelector(".view") : null; if (viewEl) viewEl.insertAdjacentHTML("beforeend", `<footer style="margin-top:40px;font-size:13px;color:var(--mut)"><div style="margin-bottom:8px">Contact: <a href="tel:+359877088117">+359 877 088 117</a> · <a href="mailto:hristiandenkov44@gmail.com">hristiandenkov44@gmail.com</a></div><a href="#/privacy">Privacy</a> · <a href="#/terms">Terms</a> · © 2026 efbet League Fantasy. Unofficial fan game.</footer>`);
            { const rd = document.querySelector(".rds"), on = document.querySelector(".rds .on"); if (rd && on) rd.scrollLeft = on.getBoundingClientRect().left - rd.getBoundingClientRect().left + rd.scrollLeft - rd.clientWidth / 2 + on.offsetWidth / 2 } if (r != PR) scrollTo(0, 0); else scrollTo(0, sy); PR = r
        }
        addEventListener("hashchange", draw); draw();
        setTimeout(() => { const l = $("#loader"); if (l) l.classList.add("off"); }, 1700);
        try { if (!localStorage.getItem("efc")) setTimeout(() => { const c = $("#cookie"); if (c) c.style.display = "block"; }, 2200) } catch (e) { }
    </script>
